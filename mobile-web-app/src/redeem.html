<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indløs præmie</title>
    <link rel="stylesheet" href="styles/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Fixed header area for bar logo -->
    <div class="top-bar"></div>
    
    <!-- Bar Logo -->
    <img src="Pictures/Indsæt logo.png" alt="Bar Logo" class="bar-logo">

    <!-- Main Content -->
    <div class="content-container">
        <!-- Redeem Form Screen -->
        <div id="redeem-screen" class="screen">
            <div class="redeem-container">
                <h2>Indløs din præmie</h2>
                <form id="redeem-form" class="redeem-form">
                    <label for="name">Dit navn:</label>
                    <input type="text" id="name" name="name" required>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>
                    <button type="submit">Indsend og få præmie</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Fixed footer area for game logo -->
    <div class="bottom-bar"></div>
    
    <!-- Game Logo -->
    <img src="Pictures/game-logo.png" alt="Game Logo" class="game-logo">

    <script src="scripts/redeem.js"></script>
</body>
</html>
